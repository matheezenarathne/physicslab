<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            user-select: none;
            overflow-x: hidden;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-panel-interactive {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .glass-panel-interactive:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }
        .accent-glow {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            height: 6px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        .custom-radio:checked + label {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-bold shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-wave-square text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-500 bg-clip-text text-transparent">
                    Wave & Oscillation Simulator
                </h1>
                <p class="text-xs text-slate-400">Interactive Physics Wave Motion Dynamics</p>
            </div>
        </div>
        <div class="flex items-center space-x-4 text-xs">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-cyan-950 text-cyan-400 border border-cyan-800">
                <span class="w-2 h-2 mr-1.5 rounded-full bg-cyan-400 animate-pulse"></span> Virtual Physics Lab v2.6
            </span>
        </div>
    </header>

    <!-- Main Canvas Studio -->
    <main class="flex-grow p-4 md:p-6 flex flex-col items-center justify-center max-w-7xl w-full mx-auto relative">
        <div class="relative w-full aspect-[16/9] max-h-[620px] rounded-2xl overflow-hidden glass-panel border border-slate-800/80 accent-glow flex flex-col">
            
            <!-- Canvas Simulation Viewport -->
            <div class="relative flex-grow w-full h-full bg-slate-950 overflow-hidden">
                <canvas id="simCanvas" class="w-full h-full block cursor-crosshair"></canvas>

                <!-- Top Left Control Box: Generator Mode -->
                <div class="absolute top-4 left-4 glass-panel p-3 rounded-xl flex flex-col space-y-2 text-xs w-40 z-10 border border-slate-700/50">
                    <span class="text-slate-400 font-semibold tracking-wider uppercase text-[10px] mb-1">Source Mode</span>
                    <div class="flex flex-col space-y-1">
                        <input type="radio" id="modeManual" name="genMode" value="manual" class="hidden custom-radio" checked>
                        <label for="modeManual" class="px-3 py-1.5 rounded-lg cursor-pointer border border-transparent hover:bg-slate-800/50 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-hand-pointer text-cyan-400"></i>
                            <span>Manual</span>
                        </label>

                        <input type="radio" id="modeOscillate" name="genMode" value="oscillate" class="hidden custom-radio">
                        <label for="modeOscillate" class="px-3 py-1.5 rounded-lg cursor-pointer border border-transparent hover:bg-slate-800/50 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-repeat text-cyan-400"></i>
                            <span>Oscillate</span>
                        </label>

                        <input type="radio" id="modePulse" name="genMode" value="pulse" class="hidden custom-radio">
                        <label for="modePulse" class="px-3 py-1.5 rounded-lg cursor-pointer border border-transparent hover:bg-slate-800/50 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-bolt text-cyan-400"></i>
                            <span>Pulse</span>
                        </label>
                    </div>
                </div>

                <!-- Top Right Control Box: Boundary Condition -->
                <div class="absolute top-4 right-4 glass-panel p-3 rounded-xl flex flex-col space-y-2 text-xs w-40 z-10 border border-slate-700/50">
                    <span class="text-slate-400 font-semibold tracking-wider uppercase text-[10px] mb-1">End Boundary</span>
                    <div class="flex flex-col space-y-1">
                        <input type="radio" id="endFixed" name="endMode" value="fixed" class="hidden custom-radio" checked>
                        <label for="endFixed" class="px-3 py-1.5 rounded-lg cursor-pointer border border-transparent hover:bg-slate-800/50 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-lock text-cyan-400"></i>
                            <span>Fixed End</span>
                        </label>

                        <input type="radio" id="endLoose" name="endMode" value="loose" class="hidden custom-radio">
                        <label for="endLoose" class="px-3 py-1.5 rounded-lg cursor-pointer border border-transparent hover:bg-slate-800/50 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-ring text-cyan-400"></i>
                            <span>Loose End</span>
                        </label>

                        <input type="radio" id="endNone" name="endMode" value="none" class="hidden custom-radio">
                        <label for="endNone" class="px-3 py-1.5 rounded-lg cursor-pointer border border-transparent hover:bg-slate-800/50 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-infinity text-cyan-400"></i>
                            <span>No End</span>
                        </label>
                    </div>
                </div>

                <!-- Floating Draggable Stopwatch Widget -->
                <div id="stopwatchWidget" class="hidden absolute top-20 left-1/2 transform -translate-x-1/2 glass-panel px-4 py-2 rounded-xl flex items-center space-x-3 text-xs border border-cyan-500/30 z-10 shadow-lg cursor-move">
                    <i class="fa-solid fa-stopwatch text-cyan-400 text-sm"></i>
                    <span id="stopwatchDisplay" class="mono-font text-sm font-semibold text-cyan-300">0.00 s</span>
                    <button id="resetStopwatch" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-rotate-right"></i></button>
                </div>

                <!-- Central Floating Pulse Launch Button -->
                <button id="pulseBtn" class="hidden absolute left-12 top-1/2 transform -translate-y-1/2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-cyan-500/30 transition border border-cyan-300/30 active:scale-95 z-10 flex items-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>Send Pulse</span>
                </button>
            </div>

            <!-- Bottom Floating Toolbar & Sliders Panel -->
            <div class="glass-panel p-4 border-t border-slate-800 flex flex-wrap items-center justify-between gap-4 z-10">
                
                <!-- Playback Controls -->
                <div class="flex items-center space-x-2">
                    <button id="playPauseBtn" class="w-10 h-10 rounded-xl bg-cyan-500/20 text-cyan-400 hover:bg-cyan-500 hover:text-slate-950 flex items-center justify-center transition border border-cyan-500/40">
                        <i class="fa-solid fa-pause text-sm" id="playIcon"></i>
                    </button>
                    <button id="stepBtn" class="w-10 h-10 rounded-xl bg-slate-800/60 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition border border-slate-700" title="Step Forward">
                        <i class="fa-solid fa-forward-step text-sm"></i>
                    </button>
                    <button id="restartBtn" class="w-10 h-10 rounded-xl bg-slate-800/60 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition border border-slate-700" title="Reset Simulation">
                        <i class="fa-solid fa-rotate-left text-sm"></i>
                    </button>
                    <div class="h-6 w-px bg-slate-800 mx-1"></div>
                    <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800 text-xs">
                        <button id="speedNormal" class="px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-400 font-medium">Normal</button>
                        <button id="speedSlow" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-slate-200">Slow Motion</button>
                    </div>
                </div>

                <!-- Parameters Sliders -->
                <div class="flex flex-wrap items-center gap-6 text-xs">
                    
                    <!-- Damping Slider -->
                    <div class="flex flex-col space-y-1 w-28 md:w-32">
                        <div class="flex justify-between text-slate-400">
                            <span>Damping</span>
                            <span id="dampingVal" class="text-cyan-400 font-mono">None</span>
                        </div>
                        <input type="range" id="dampingSlider" min="0" max="100" value="10">
                    </div>

                    <!-- Tension Slider -->
                    <div class="flex flex-col space-y-1 w-28 md:w-32">
                        <div class="flex justify-between text-slate-400">
                            <span>Tension</span>
                            <span id="tensionVal" class="text-cyan-400 font-mono">High</span>
                        </div>
                        <input type="range" id="tensionSlider" min="10" max="100" value="80">
                    </div>

                    <!-- Frequency / Amplitude Controls (Dynamic) -->
                    <div id="oscControls" class="flex items-center space-x-4 opacity-50 pointer-events-none transition">
                        <div class="flex flex-col space-y-1 w-24">
                            <div class="flex justify-between text-slate-400">
                                <span>Frequency</span>
                                <span id="freqVal" class="text-cyan-400 font-mono">1.5 Hz</span>
                            </div>
                            <input type="range" id="freqSlider" min="0.1" max="3" step="0.1" value="1.5">
                        </div>

                        <div class="flex flex-col space-y-1 w-24">
                            <div class="flex justify-between text-slate-400">
                                <span>Amplitude</span>
                                <span id="ampVal" class="text-cyan-400 font-mono">0.75 cm</span>
                            </div>
                            <input type="range" id="ampSlider" min="0.1" max="1.5" step="0.05" value="0.75">
                        </div>
                    </div>
                </div>

                <!-- Measurement Overlay Controls -->
                <div class="flex items-center space-x-3 text-xs border-l border-slate-800 pl-4">
                    <label class="flex items-center space-x-1.5 cursor-pointer text-slate-300 hover:text-cyan-400">
                        <input type="checkbox" id="chkRuler" class="rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0">
                        <span>Rulers</span>
                    </label>
                    <label class="flex items-center space-x-1.5 cursor-pointer text-slate-300 hover:text-cyan-400">
                        <input type="checkbox" id="chkStopwatch" class="rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0">
                        <span>Timer</span>
                    </label>
                    <label class="flex items-center space-x-1.5 cursor-pointer text-slate-300 hover:text-cyan-400">
                        <input type="checkbox" id="chkReference" class="rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0" checked>
                        <span>Ref Line</span>
                    </label>
                </div>

            </div>
        </div>
    </main>

    <!-- Professional Footer -->
    <footer class="glass-panel border-t border-slate-800 py-3 px-6 mt-4 text-center text-xs text-slate-400 flex flex-wrap justify-between items-center gap-2">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-code text-cyan-400"></i>
            <span class="font-medium text-slate-300">Matheesha Senarathne Concepts & Co.</span>
            <span>&bull; 2026 All Rights Reserved</span>
        </div>
        <div class="flex items-center space-x-1 hover:text-cyan-400 transition">
            <i class="fa-regular fa-envelope"></i>
            <a href="mailto:matheezenarathne@gmail.com" class="hover:underline">contact us: matheezenarathne@gmail.com</a>
        </div>
    </footer>

    <!-- Interactive Simulation Logic Engine -->
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // State Variables
        let isPlaying = true;
        let timeScale = 1.0;
        let genMode = 'manual'; // manual, oscillate, pulse
        let endMode = 'fixed';  // fixed, loose, none

        const NUM_POINTS = 90;
        let points = [];
        let damping = 0.01;
        let tension = 0.8;
        let frequency = 1.5;
        let amplitude = 40;

        let generatorY = 0;
        let isDraggingGenerator = false;
        let mousePos = { x: 0, y: 0 };

        // Stopwatch state
        let stopwatchTime = 0;
        let isStopwatchRunning = false;

        // Pulse State
        let activePulse = false;
        let pulseTimer = 0;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            initPoints();
        }

        function initPoints() {
            points = [];
            const spacing = canvas.width / (NUM_POINTS - 1);
            const centerY = canvas.height / 2;
            for (let i = 0; i < NUM_POINTS; i++) {
                points.push({
                    x: i * spacing,
                    y: centerY,
                    vy: 0,
                    pinned: i === 0
                });
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Interaction (Manual Wrench Dragging)
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            if (x < 60) {
                isDraggingGenerator = true;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = e.clientX - rect.left;
            mousePos.y = e.clientY - rect.top;
            if (isDraggingGenerator && genMode === 'manual') {
                const centerY = canvas.height / 2;
                points[0].y = Math.min(Math.max(mousePos.y, centerY - 120), centerY + 120);
                points[0].vy = 0;
            }
        });

        window.addEventListener('mouseup', () => {
            isDraggingGenerator = false;
        });

        // UI Event Listeners
        document.querySelectorAll('input[name="genMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                genMode = e.target.value;
                const oscControls = document.getElementById('oscControls');
                const pulseBtn = document.getElementById('pulseBtn');
                if (genMode === 'oscillate') {
                    oscControls.classList.remove('opacity-50', 'pointer-events-none');
                    pulseBtn.classList.add('hidden');
                } else if (genMode === 'pulse') {
                    oscControls.classList.add('opacity-50', 'pointer-events-none');
                    pulseBtn.classList.remove('hidden');
                } else {
                    oscControls.classList.add('opacity-50', 'pointer-events-none');
                    pulseBtn.classList.add('hidden');
                }
            });
        });

        document.querySelectorAll('input[name="endMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                endMode = e.target.value;
            });
        });

        document.getElementById('dampingSlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            damping = (val / 100) * 0.08;
            document.getElementById('dampingVal').innerText = val === 0 ? 'None' : (val > 60 ? 'High' : 'Medium');
        });

        document.getElementById('tensionSlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            tension = (val / 100) * 0.9 + 0.1;
            document.getElementById('tensionVal').innerText = val < 40 ? 'Low' : (val > 70 ? 'High' : 'Medium');
        });

        document.getElementById('freqSlider').addEventListener('input', (e) => {
            frequency = parseFloat(e.target.value);
            document.getElementById('freqVal').innerText = frequency.toFixed(1) + ' Hz';
        });

        document.getElementById('ampSlider').addEventListener('input', (e) => {
            amplitude = parseFloat(e.target.value) * 50;
            document.getElementById('ampVal').innerText = e.target.value + ' cm';
        });

        // Play/Pause & Speed
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playIcon.className = isPlaying ? "fa-solid fa-pause text-sm" : "fa-solid fa-play text-sm";
        });

        document.getElementById('stepBtn').addEventListener('click', () => {
            if (!isPlaying) stepSimulation(0.016);
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            initPoints();
            stopwatchTime = 0;
            document.getElementById('stopwatchDisplay').innerText = "0.00 s";
        });

        document.getElementById('speedNormal').addEventListener('click', function() {
            timeScale = 1.0;
            this.className = "px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-400 font-medium";
            document.getElementById('speedSlow').className = "px-2.5 py-1 rounded-lg text-slate-400 hover:text-slate-200";
        });

        document.getElementById('speedSlow').addEventListener('click', function() {
            timeScale = 0.25;
            this.className = "px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-400 font-medium";
            document.getElementById('speedNormal').className = "px-2.5 py-1 rounded-lg text-slate-400 hover:text-slate-200";
        });

        // Pulse Trigger
        document.getElementById('pulseBtn').addEventListener('click', () => {
            activePulse = true;
            pulseTimer = 0;
        });

        // Stopwatch Overlay Toggle
        const chkStopwatch = document.getElementById('chkStopwatch');
        const stopwatchWidget = document.getElementById('stopwatchWidget');
        chkStopwatch.addEventListener('change', (e) => {
            if (e.target.checked) stopwatchWidget.classList.remove('hidden');
            else stopwatchWidget.classList.add('hidden');
        });

        document.getElementById('resetStopwatch').addEventListener('click', () => {
            stopwatchTime = 0;
            document.getElementById('stopwatchDisplay').innerText = "0.00 s";
        });

        // Simulation Step Engine
        let lastTime = performance.now();

        function stepSimulation(dt) {
            const centerY = canvas.height / 2;
            const c2 = tension * 1200; // Wave speed squared factor

            // Driver/Generator logic at x = 0
            if (genMode === 'oscillate') {
                pulseTimer += dt;
                points[0].y = centerY + Math.sin(pulseTimer * frequency * Math.PI * 2) * amplitude;
            } else if (genMode === 'pulse') {
                if (activePulse) {
                    pulseTimer += dt;
                    const duration = 0.4;
                    if (pulseTimer < duration) {
                        points[0].y = centerY - Math.sin((pulseTimer / duration) * Math.PI) * amplitude;
                    } else {
                        points[0].y = centerY;
                        activePulse = false;
                    }
                }
            }

            // Wave Equation Solver (1D Finite Difference with Damping)
            for (let i = 1; i < NUM_POINTS - 1; i++) {
                const forceLeft = points[i - 1].y - points[i].y;
                const forceRight = points[i + 1].y - points[i].y;
                const acceleration = (forceLeft + forceRight) * c2 * 0.00005;
                
                points[i].vy += acceleration;
                points[i].vy *= (1 - damping);
            }

            // Update Positions
            for (let i = 1; i < NUM_POINTS - 1; i++) {
                points[i].y += points[i].vy * dt * 60;
            }

            // Boundary Conditions at Right End
            const last = NUM_POINTS - 1;
            if (endMode === 'fixed') {
                points[last].y = centerY;
                points[last].vy = 0;
            } else if (endMode === 'loose') {
                points[last].y = points[last - 1].y;
                points[last].vy = points[last - 1].vy;
            } else if (endMode === 'none') {
                // Absorbing boundary approximation
                points[last].y = points[last - 1].y;
            }

            // Update Stopwatch
            if (isPlaying) {
                stopwatchTime += dt;
                document.getElementById('stopwatchDisplay').innerText = stopwatchTime.toFixed(2) + " s";
            }
        }

        // Render Graphics Loop
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerY = canvas.height / 2;

            // Background Grid Lines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // Reference Baseline Line
            if (document.getElementById('chkReference').checked) {
                ctx.strokeStyle = "rgba(56, 189, 248, 0.2)";
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(0, centerY);
                ctx.lineTo(canvas.width, centerY);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Rulers
            if (document.getElementById('chkRuler').checked) {
                ctx.fillStyle = "rgba(148, 163, 184, 0.5)";
                ctx.font = "10px JetBrains Mono";
                for (let x = 0; x < canvas.width; x += 100) {
                    ctx.fillRect(x, centerY - 10, 1, 20);
                    ctx.fillText((x / 10) + " cm", x + 4, centerY + 25);
                }
            }

            // Draw String / Beads
            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(56, 189, 248, 0.6)";
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < NUM_POINTS; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();

            // Draw glowing bead nodes
            for (let i = 0; i < NUM_POINTS; i++) {
                ctx.beginPath();
                ctx.arc(points[i].x, points[i].y, 5, 0, Math.PI * 2);
                const colorRatio = Math.abs(points[i].y - centerY) / 60;
                ctx.fillStyle = i % 2 === 0 ? "#38bdf8" : (colorRatio > 0.5 ? "#f43f5e" : "#818cf8");
                ctx.shadowColor = "#38bdf8";
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Draw Generator Wrench/Piston Handle on the left
            ctx.fillStyle = "#1e293b";
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            const genY = points[0].y;
            
            // Wrench Body Graphics
            ctx.beginPath();
            ctx.roundRect(10, genY - 25, 20, 50, 6);
            ctx.fill();
            ctx.stroke();

            // Up/Down Arrows for manual guidance
            if (genMode === 'manual') {
                ctx.fillStyle = "#38bdf8";
                ctx.beginPath();
                ctx.moveTo(20, genY - 35);
                ctx.lineTo(15, genY - 28);
                ctx.lineTo(25, genY - 28);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(20, genY + 35);
                ctx.lineTo(15, genY + 28);
                ctx.lineTo(25, genY + 28);
                ctx.fill();
            }

            // Draw Right Boundary Mount Graphics
            const lastX = points[NUM_POINTS - 1].x;
            if (endMode === 'fixed') {
                ctx.fillStyle = "#475569";
                ctx.fillRect(lastX, centerY - 60, 12, 120);
                ctx.strokeStyle = "#64748b";
                ctx.strokeRect(lastX, centerY - 60, 12, 120);
            } else if (endMode === 'loose') {
                // Vertical rod with sliding ring
                ctx.strokeStyle = "#64748b";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(lastX, centerY - 100);
                ctx.lineTo(lastX, centerY + 100);
                ctx.stroke();

                // Ring
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(lastX, points[NUM_POINTS - 1].y, 8, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // Main Loop
        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.033) * timeScale;
            lastTime = timestamp;

            if (isPlaying) {
                stepSimulation(dt);
            }

            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
